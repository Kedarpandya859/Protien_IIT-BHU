function Episode({ go, scene, setScene }) {
  const videoRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [videoError, setVideoError] = useState(false);
  const scenes = [
    { quote: "Bhai, beard toh bana le. Aaj interview hai!", speaker: "Vicky", note: "\u00a0\u00a0\u00a0\u00a0\u00a0" },
    { quote: "Bas yahi hona tha!", speaker: "Ravi", note: "The old trimmer stops working." },
    { quote: "Ye wala try kar. Battery bhi full hai.", speaker: "Vicky", note: "A small problem, sorted just in time." },
  ];
  const current = scenes[scene];
  const togglePlayback = () => {
    const video = videoRef.current;
    if (!video) return;
    if (video.paused) { video.play().catch(() => setVideoError(true)); } else { video.pause(); }
  };
  const seekToScene = (n) => { const video = videoRef.current; setScene(n); if (video?.duration) video.currentTime = (video.duration / scenes.length) * n; };

  return <main className="story-screen">
    <video ref={videoRef} className="story-video" poster={images.friends} playsInline preload="metadata" onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)} onEnded={() => { setPlaying(false); setScene(scenes.length-1); }} onError={() => setVideoError(true)}>
      <source src="https://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4" />
    </video>
    <div className="story-overlay" />
    <div className="story-top"><div className="story-progress">{scenes.map((_,i) => <i key={i} className={i <= scene ? "filled" : ""} />)}</div><div className="story-header"><Btn variant="ghost" className="icon-button glass" onClick={() => go("series")}><Icon name="back" /></Btn><div><strong>First Salary</strong><span>Episode 6 • Interview Day</span></div><Btn variant="ghost" className="icon-button glass"><Icon name="share" /></Btn></div></div>
    <button className={`play-control ${playing ? "is-playing" : ""}`} onClick={togglePlayback}><Icon name={playing ? "pause" : "play"} size={30} /></button>
    {videoError && <div style={{position:'absolute',zIndex:4,top:135,left:18,right:18,padding:'9px 11px',borderRadius:9,color:'white',background:'rgba(117,22,100,.88)',fontSize:9,lineHeight:1.4,textAlign:'center'}}>Video needs an internet connection. Continue the story below.</div>}
    <div className="dialogue"><span>{current.note}</span></div>
    <div className="story-bottom">
      <section className="story-product" onClick={() => go("product")}><img src={images.trimmer} alt="Nova Cordless Trimmer" /><div className="story-product-copy"><span>USED IN THIS EPISODE</span><strong>Nova Cordless Trimmer</strong><div><b>₹699</b><small>★ 4.2 • 10K+ ratings</small></div></div><Btn className="product-arrow" onClick={() => go("product")}>View Product <b>›</b></Btn></section>
      <div className="story-actions"><Btn variant="dark" onClick={() => seekToScene(Math.max(0, scene-1))} disabled={scene===0}>Previous</Btn>{scene < scenes.length-1 ? <Btn onClick={() => seekToScene(scene+1)}>Continue Watching <b>›</b></Btn> : <Btn onClick={() => go("nextEpisode")}>Next Episode <b>›</b></Btn>}</div>
      <span className="swipe-hint">{playing ? "Now playing with audio" : "Tap play to watch with audio"}</span>
    </div>
  </main>;
}

      <section className="preview-stage">
        <span className="preview-label">LIVE PREVIEW</span>
        <MerchPreview merch={merch} mode={mode} photo={photo} name={name} color={color} />
        <span className="preview-note">Actual print size may vary slightly</span>
      </section>

      <section className="custom-controls">
        <div className="section-title">What would you like to print?</div>
        <div className="mode-tabs">
          <Btn variant={mode === "photo" ? "soft" : "outline"} onClick={() => setMode("photo")}>Upload Photo</Btn>
          <Btn variant={mode === "name" ? "soft" : "outline"} onClick={() => setMode("name")}>Add Name / Text</Btn>
        </div>
        {mode === "photo" ? (
          <div className="upload-box" onClick={() => uploadRef.current?.click()}>
            {photo ? <img src={photo} alt="Your uploaded print" /> : <div className="upload-symbol">+</div>}
            <div><strong>{photo ? "Photo uploaded" : "Choose a photo"}</strong><span>{photo ? "Tap to replace photo" : "JPG or PNG • Clear photos print best"}</span></div>
            <Btn variant="outline" onClick={(e) => { e.stopPropagation(); uploadRef.current?.click(); }}>{photo ? "Change" : "Upload"}</Btn>
            <input ref={uploadRef} type="file" accept="image/png,image/jpeg" onChange={onFile} className="hidden-file" aria-label="Upload photo to print" />
          </div>
        ) : (
          <div className="name-control">
            <label htmlFor="print-name">Name or message</label>
            <input id="print-name" value={name} maxLength={18} onChange={(e) => setName(e.target.value.toUpperCase())} placeholder="ENTER NAME" aria-label="Name to print" />
            <span>{name.length}/18 characters</span>
          </div>
        )}

        {!["Pillow", "Mug"].includes(merch) && (
          <div className="option-block"><strong>Select size</strong><div className="option-row">{["S", "M", "L", "XL", "XXL"].map((item) => <Btn key={item} variant={size === item ? "soft" : "outline"} onClick={() => setSize(item)}>{item}</Btn>)}</div></div>
        )}
        <div className="option-block"><strong>Select color</strong><div className="color-row">{["White", "Black", "Pink", "Blue"].map((item) => <Btn key={item} variant="ghost" className={color === item ? "selected" : ""} onClick={() => setColor(item)}><i className={`color-dot color-${item.toLowerCase()}`} />{item}</Btn>)}</div></div>
        <div className="print-promise"><Icon name="shield" size={25} /><div><strong>Meesho Print Promise</strong><span>Preview checked before printing • Easy help for print issues</span></div></div>
        <section className="custom-summary">
          <div><span>Custom {merch}</span><strong>{prices[merch]}</strong><small>Free Delivery • Made to order</small></div>
          <span>Delivery in 6 to 8 days</span>
        </section>
      </section>
      {added && <div className="added-toast"><Icon name="check" size={17} /> Personalized item added to cart</div>}
    </main>
    <div className="commerce-bar custom-commerce">
      <Btn variant="outline" onClick={() => setAdded(true)}><Icon name="cart" size={18} /> Add to Cart</Btn>
      <Btn onClick={() => setOrdered(true)}>Buy Now • {prices[merch]}</Btn>
    </div>
  </>
  );
}

function MerchPreview({ merch, mode, photo, name, color, compact = false }) {
  return (
    <div className={`merch-preview merch-${merch.toLowerCase()} merch-color-${color.toLowerCase()} ${compact ? "compact-preview" : ""}`}>
      <div className="print-area">
        {mode === "photo" ? (
          photo ? <img src={photo} alt="Uploaded design preview" /> : <div className="photo-placeholder"><Icon name="user" size={compact ? 18 : 34} /><span>Your photo</span></div>
        ) : <span className="printed-name">{name || "YOUR NAME"}</span>}
      </div>
      {merch === "Mug" && <i className="mug-handle" />}
      {merch === "Hoodie" && <i className="hood" />}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("home");
  const [episodeScene, setEpisodeScene] = useState(0);
  const [productKind, setProductKind] = useState("trimmer");
  const [mobileOpen, setMobileOpen] = useState(false);

  const go = (next) => {
    setScreen(next);
    setMobileOpen(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const resetFlow = () => {
    setEpisodeScene(0);
    setProductKind("trimmer");
    go("home");
  };

  return (
    <div className="prototype-wrapper">
      <button
        className="panel-mobile-toggle"
        onClick={() => setMobileOpen(!mobileOpen)}
        aria-label="Toggle navigation panel"
      >
        <span>{mobileOpen ? "✕ Close Steps" : "☰ Flow Steps"}</span>
      </button>

      {mobileOpen && (
        <div className="panel-backdrop" onClick={() => setMobileOpen(false)} />
      )}

      <aside className={`vertical-nav-panel ${mobileOpen ? "open" : ""}`}>
        <div className="vpanel-header">
          <div className="vpanel-badge-row">
            <span className="vpanel-pill">FEATURE 2</span>
            <span className="vpanel-source">Meesho DICE</span>
          </div>
          <h1 className="vpanel-title">MiniDrama & Creator Merch</h1>
          <p className="vpanel-desc">Interactive in-video shopping flow</p>
        </div>

        <div className="vpanel-scroll">
          <div className="vpanel-group">
            <div className="vgroup-header">
              <span className="vgroup-title">In-Story Commerce</span>
              <span className="vgroup-count">7 steps</span>
            </div>
            <div className="vstep-list">
              <button
                className={`vstep-btn ${screen==='home'?'active':''}`}
                onClick={() => go('home')}
              >
                <span className="vstep-num">01</span>
                <div className="vstep-info">
                  <span className="vstep-name">Home Feed</span>
                  <span className="vstep-sub">Banner entry point</span>
                </div>
                {screen==='home' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${screen==='discover'?'active':''}`}
                onClick={() => go('discover')}
              >
                <span className="vstep-num">02</span>
                <div className="vstep-info">
                  <span className="vstep-name">Drama Hub</span>
                  <span className="vstep-sub">Shorts, reels, trending</span>
                </div>
                {screen==='discover' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${screen==='series'?'active':''}`}
                onClick={() => go('series')}
              >
                <span className="vstep-num">03</span>
                <div className="vstep-info">
                  <span className="vstep-name">Series Overview</span>
                  <span className="vstep-sub">Episodes & cast cards</span>
                </div>
                {screen==='series' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${screen==='episode'?'active':''}`}
                onClick={() => { setEpisodeScene(0); go('episode'); }}
              >
                <span className="vstep-num">04</span>
                <div className="vstep-info">
                  <span className="vstep-name">Ep 6 Player</span>
                  <span className="vstep-sub">In-video product overlay</span>
                </div>
                {screen==='episode' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${screen==='product'&&productKind==='trimmer'?'active':''}`}
                onClick={() => { setProductKind('trimmer'); go('product'); }}
              >
                <span className="vstep-num">05</span>
                <div className="vstep-info">
                  <span className="vstep-name">Trimmer Buy</span>
                  <span className="vstep-sub">Contextual one-tap buy</span>
                </div>
                {screen==='product'&&productKind==='trimmer' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${screen==='confirmation'?'active':''}`}
                onClick={() => { setProductKind('trimmer'); go('confirmation'); }}
              >
                <span className="vstep-num">06</span>
                <div className="vstep-info">
                  <span className="vstep-name">Order Placed</span>
                  <span className="vstep-sub">Instant buy confirmation</span>
                </div>
                {screen==='confirmation' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${screen==='nextEpisode'?'active':''}`}
                onClick={() => go('nextEpisode')}
              >
                <span className="vstep-num">07</span>
                <div className="vstep-info">
                  <span className="vstep-name">Ep 7 Watch</span>
                  <span className="vstep-sub">Continuous binge play</span>
                </div>
                {screen==='nextEpisode' && <span className="vstep-dot" />}
              </button>
            </div>
          </div>

          <div className="vpanel-group">
            <div className="vgroup-header">
              <span className="vgroup-title">Creator Merch</span>
              <span className="vgroup-count">2 steps</span>
            </div>
            <div className="vstep-list">
              <button
                className={`vstep-btn ${screen==='categories'?'active':''}`}
                onClick={() => go('categories')}
              >
                <span className="vstep-num">08</span>
                <div className="vstep-info">
                  <span className="vstep-name">Merch Store</span>
                  <span className="vstep-sub">Apparel, mugs, hoodies</span>
                </div>
                {screen==='categories' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${screen==='customize'?'active':''}`}
                onClick={() => go('customize')}
              >
                <span className="vstep-num">09</span>
                <div className="vstep-info">
                  <span className="vstep-name">Live Customizer</span>
                  <span className="vstep-sub">Interactive print preview</span>
                </div>
                {screen==='customize' && <span className="vstep-dot" />}
              </button>
            </div>
          </div>
        </div>

        <div className="vpanel-footer">
          <button className="vpanel-reset-btn" onClick={resetFlow}>
            ↺ Reset Flow
          </button>
          <a href="index.html" className="vpanel-hub-link">
            ← Back to Feature Hub
          </a>
        </div>
      </aside>

      <main className="prototype-stage">
        <div className="device-frame-wrap">
          <div className="phone-shell">
            {screen === "home" && <Home go={go} />}
            {screen === "categories" && <Categories go={go} />}
            {screen === "customize" && <Customizer go={go} />}
            {screen === "discover" && <Discover go={go} />}
            {screen === "series" && <Series go={go} />}
            {screen === "episode" && <Episode go={go} scene={episodeScene} setScene={setEpisodeScene} />}
            {screen === "product" && <Product go={go} kind={productKind} setKind={setProductKind} />}
            {screen === "confirmation" && <Confirmation go={go} kind={productKind} />}
            {screen === "nextEpisode" && <NextEpisode go={go} setKind={setProductKind} />}
            <div className="home-indicator" />
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
