/* ─── ONBOARDING CSS ──────────────────────────────── */
:root {
  font-family: "Nunito", "Arial", "Helvetica Neue", sans-serif;

  background: #f4f4f4;

* { box-sizing: border-box; }

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }

.app-shell { width: 100%; min-height: 100vh; background: #fff; overflow-x: hidden; }
.prototype-data { display: none; }
.splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #fff7fd 0%, #fff 68%); color: #9f2089; position: relative; }
.meesho-mark { width: 92px; height: 92px; border-radius: 28px; background: #9f2089; display: grid; place-items: center; box-shadow: 0 14px 34px #9f208940; }
.meesho-mark span { color: #fff; font: 800 72px/1 Arial; transform: translateY(-5px); }
.meesho-logo { font-size: 48px; line-height: 1; font-weight: 800; letter-spacing: -2px; margin-top: 20px; }
.splash p { color: #616173; font-size: 15px; margin: 12px 0 36px; }
.loader { width: 126px; height: 4px; background: #f3d9ee; border-radius: 99px; overflow: hidden; }
.loader i { display: block; width: 45%; height: 100%; background: #9f2089; border-radius: inherit; animation: loading 1s ease-in-out infinite alternate; }
.splash small { position: absolute; bottom: 42px; color: #8b8b97; }
@keyframes loading { to { transform: translateX(122%); } }
.onboarding-screen { min-height: 100vh; background: #fff; }
.visual-top { height: 48vh; max-height: 510px; min-height: 380px; position: relative; overflow: hidden; background: linear-gradient(#fde9fa, #fff); }
.visual-top::after { content: ""; position: absolute; inset: auto 0 0; height: 110px; background: linear-gradient(transparent, #fff); pointer-events: none; }
.mosaic { height: 100%; padding: 0 20px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 29%; gap: 8px 10px; transform: translateY(-26px); }
.mosaic img { width: 100%; height: 100%; object-fit: cover; border-radius: 13px; background: #eee; }
.mosaic img:nth-child(2), .mosaic img:nth-child(5), .mosaic img:nth-child(8) { transform: translateY(52px); }
.onboard-toolbar { position: absolute; inset: 20px 20px auto; z-index: 3; display: flex; align-items: center; justify-content: space-between; }
.round-button { width: 48px; height: 48px; background: #fff; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 2px 10px #00000013; }
.step-pill { padding: 5px 12px; background: #ffffffee; border: 1px solid #eeeaf0; border-radius: 999px; font-size: 13px; color: #616173; }
.voice-button { min-height: 48px; border-radius: 24px; background: #fff; border: 1px solid #e8d5e5; display: flex; align-items: center; gap: 7px; padding: 0 14px; color: #9f2089; font-weight: 700; font-size: 13px; box-shadow: 0 2px 10px #9f208915; }
.voice-button.speaking { animation: pulse 0.8s infinite alternate; }
@keyframes pulse { to { box-shadow: 0 0 0 8px #9f208920; } }
.onboard-content { padding: 8px 20px 40px; }
.onboard-content h1, .interest-title h1 { margin: 0; color: #292934; font-size: clamp(29px, 8vw, 36px); line-height: 1.2; font-weight: 700; letter-spacing: -0.8px; }
.onboard-content p, .interest-title p { margin: 9px 0 0; color: #666673; font-size: 17px; }
.gender-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 30px; }
.choice-card { min-height: 126px; border: 1px solid #dedee5; border-radius: 13px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 20px; position: relative; color: #1a161f; font-weight: 700; }
.avatar { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-size: 43px; background: #fff0c9; overflow: hidden; }
.age-content { padding-top: 0; }
.age-list { display: grid; gap: 12px; margin-top: 28px; }
.age-list button { min-height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px 0 28px; border: 1px solid #dedee5; border-radius: 13px; font-size: 20px; overflow: hidden; position: relative; color: #1a161f; font-weight: 700; }
.age-list button::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 9px; background: #df9ed1; }

.interest-screen { min-height: 100vh; background: #fff; padding-bottom: 88px; }
.interest-header { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #eee; }

.popular-label small { font-size: 12px; color: #666673; font-weight: 500; }
.interest-grid { padding: 0 12px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.interest-card { aspect-ratio: .86; border-radius: 13px; overflow: hidden; position: relative; background: #f3f3f5; border: 2px solid transparent; text-align: left; padding: 0; }
.interest-card img { width: 100%; height: 100%; object-fit: cover; }
.interest-card::after { content: ""; position: absolute; inset: 35% 0 0; background: linear-gradient(transparent, #000c); }
.interest-card > span { position: absolute; left: 9px; right: 28px; bottom: 9px; z-index: 2; color: white; font-size: 12px; line-height: 1.15; font-weight: 700; text-shadow: 0 1px 2px #000; }

.interest-card.selected { border-color: #9f2089; box-shadow: inset 0 0 0 1px #fff; }
.interest-card.selected i { color: #fff; background: #9f2089; }
.continue-bar { position: sticky; z-index: 20; bottom: 0; left: 0; right: 0; width: 100%; background: #fff; border-top: 1px solid #e8e8ec; min-height: 76px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 -4px 20px #00000012; }
.continue-bar > span { color: #4b4b54; font-size: 13px; font-weight: 600; flex: 1; }

.continue-bar button span { font-size: 23px; margin-left: 8px; vertical-align: -2px; }
.home-screen { flex: 1; height: 100%; overflow-y: auto; overflow-x: hidden; padding-bottom: 80px; background: #f5f5f7; color: #1a161f; position: relative; box-sizing: border-box; }
.home-header { background: #fff; padding: 0 14px 14px; position: relative; z-index: 2; color: #1a161f; }
.status { height: 31px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #4b4b54; padding: 0 2px; font-weight: 700; }
.brand-row { display: flex; align-items: center; gap: 13px; min-height: 56px; color: #1a161f; }

.brand-row button { width: 42px; height: 42px; display: grid; place-items: center; }
.hello-icon { width: 45px; height: 45px; display: grid; place-items: center; background: #ffeed3; border-radius: 50%; font-size: 24px; }
.search-bar { width: 100%; min-height: 51px; border: 1px solid #bfc0c9; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; gap: 11px; color: #9292a0; }
.search-bar span { flex: 1; text-align: left; font-size: 14px; }
.first-order-banner { margin: 12px 12px 0; width: calc(100% - 24px); height: 76px; padding: 0 17px; border: 1px solid #0b9477; border-radius: 13px; display: flex; align-items: center; justify-content: space-between; color: #078767; background: linear-gradient(90deg, #fff, #effffb); text-align: left; box-shadow: 0 3px 7px #0085691f; }
.first-order-banner span { font-size: 15px; }
.first-order-banner strong { font-size: 28px; line-height: 1.2; }
.first-order-banner b { font-size: 42px; }
.trust-strip { margin: 12px 0 0; background: #fff0fc; border-top: 1px solid #efcae8; border-bottom: 1px solid #efcae8; padding: 11px 14px; display: grid; grid-template-columns: repeat(3, 1fr); }

.trust-strip span { color: #9f2089; font-size: 18px; display: inline-block; margin-right: 5px; }
.home-section, .flash-section { background: #fff; margin-top: 8px; padding: 16px 13px 18px; }
.section-heading { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 13px; gap: 10px; }
.section-heading h2, .trend-banner h2 { margin: 0; font-size: 19px; line-height: 1.25; color: #292934; }
.section-heading p { margin: 3px 0 0; font-size: 12px; color: #8b8b97; }
.section-heading button { font-size: 12px; color: #9f2089; font-weight: 700; min-height: 32px; white-space: nowrap; }
.horizontal-cards { display: flex; overflow-x: auto; gap: 9px; scrollbar-width: none; margin-right: -13px; padding-right: 13px; }
.deal-card { flex: 0 0 126px; text-align: left; border: 1px solid #ececf0; border-radius: 10px; overflow: hidden; padding: 0 0 9px; background: #fff; color: #1a161f; }
.deal-card img { width: 100%; height: 132px; object-fit: cover; background: #eee; }
.deal-card span, .deal-card strong { display: block; margin: 7px 8px 0; }
.deal-card .deal-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #4e4e5a; font-size: 11px; font-weight: 600; }
.deal-card strong { font-size: 16px; color: #1a161f; font-weight: 800; }
.pink-section { background: #fff6fd; }
.price-bubbles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.price-bubbles button { position: relative; border-radius: 11px; overflow: hidden; height: 150px; }
.price-bubbles img { width: 100%; height: 100%; object-fit: cover; }
.price-bubbles button::after { content: ""; position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, #66104fcf); }

.category-shortcuts { display: grid; grid-template-columns: repeat(6, 77px); gap: 8px; overflow-x: auto; scrollbar-width: none; margin-right: -13px; }
.category-shortcuts img { width: 68px; height: 68px; margin: auto; object-fit: cover; border-radius: 50%; border: 3px solid #f5d5ed; }

.flash-section { background: linear-gradient(145deg, #861570, #b62598); color: white; }

.flash-top span { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 19px; }
.flash-top strong { background: white; color: #9f2089; padding: 6px 8px; border-radius: 5px; font-size: 11px; }
.flash-section > p { margin: 4px 0 13px; color: #f5d8ef; font-size: 12px; }

.trend-banner { height: 188px; margin-top: 8px; padding-left: 18px; background: #e9e9f5; display: flex; overflow: hidden; }
.trend-banner > div { width: 56%; align-self: center; position: relative; z-index: 2; }

.trend-banner h2 { font-size: 21px; margin: 7px 0 15px; }

.recent-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }

.bottom-nav { position: absolute; z-index: 25; bottom: 0; left: 0; right: 0; width: 100%; height: 65px; display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-top: 1px solid #e5e0e5; box-sizing: border-box; }

.sheet-backdrop { position: absolute; z-index: 50; inset: 0; background: #0007; display: flex; align-items: flex-end; justify-content: center; }
.detail-sheet { width: 100%; max-width: 100%; max-height: 85%; background: white; border-radius: 20px 20px 0 0; position: relative; padding: 18px 18px 28px; animation: slideup .25s ease-out; overflow: auto; box-sizing: border-box; color: #1a161f; }

.delivery, .sheet-copy { color: #70707c; font-size: 14px; }
.primary-action { width: 100%; min-height: 52px; margin-top: 12px; border-radius: 6px; background: #9f2089; color: #fff; font-weight: 700; }

/* ─── TRANSITION BANNER ──────────────────────────── */
.transition-banner { padding: 28px 20px; background: linear-gradient(135deg, #9f2089, #d946a8); text-align: center; color: white; }
.transition-banner h2 { margin: 0 0 8px; font-size: 22px; }
.transition-banner p { margin: 0 0 18px; font-size: 14px; opacity: .88; }
.transition-banner button { min-height: 52px; width: 100%; background: white; color: #9f2089; border-radius: 12px; font-weight: 800; font-size: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }

/* ─── SUMMARIZER CSS (phone shell) ────────────────── */
.scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
.scrollbar-hide::-webkit-scrollbar { display: none; }
.app-stage-2 { width: 100%; display: flex; justify-content: center; background: transparent; padding: 0; margin: 0; }
.phone-shell { width: 100%; max-width: 410px; height: 820px; flex-shrink: 0; }
.phone-screen { position: relative; display: flex; width: 100%; height: 100%; flex-direction: column; }
.voice-bar { width: 2px; height: 10px; border-radius: 999px; background: currentColor; animation: voicePulse 0.8s ease-in-out infinite alternate; }
.voice-bar:nth-child(2) { animation-delay: 0.2s; }
.voice-bar:nth-child(3) { animation-delay: 0.4s; }
@keyframes voicePulse { from { height: 4px; opacity: 0.55; } to { height: 12px; opacity: 1; } }
.slide-up { animation: slideUp 0.25s ease-out; }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.fade-in { animation: fadeIn 0.2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ═══════════════════════════════════════════════════════
   PHASE MANAGER - Onboarding → Summarizer transition
   ═══════════════════════════════════════════════════════ */

function App() {
  const [phase, setPhase] = useState("onboarding"); // "onboarding" | "summarizer"
  const [onboardScreen, setOnboardScreen] = useState("splash");
  const [summarizerScreen, setSummarizerScreen] = useState("listing");
  const [compareIds, setCompareIds] = useState([]);
  const [mobileOpen, setMobileOpen] = useState(false);

  const resetAll = () => {
    setPhase("onboarding");
    setOnboardScreen("splash");
    setSummarizerScreen("listing");
    setCompareIds([]);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const jumpTo = (targetPhase, targetScreen) => {
    setPhase(targetPhase);
    if (targetPhase === "onboarding") {
      setOnboardScreen(targetScreen);
    } else {
      setSummarizerScreen(targetScreen);
      if (targetScreen === 'compare' && compareIds.length < 2) {
        setCompareIds([1, 2, 3]);
      }
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  return (
    <div className="prototype-wrapper">
      <button
        className="panel-mobile-toggle"
        onClick={() => setMobileOpen(!mobileOpen)}
        aria-label="Toggle navigation panel"
      >
        <span>{mobileOpen ? "✕ Close Steps" : "☰ Flow Steps"}</span>
      </button>

      {mobileOpen && (
        <div className="panel-backdrop" onClick={() => setMobileOpen(false)} />
      )}

      <aside className={`vertical-nav-panel ${mobileOpen ? "open" : ""}`}>
        <div className="vpanel-header">
          <div className="vpanel-badge-row">
            <span className="vpanel-pill">FEATURE 1</span>
            <span className="vpanel-source">Meesho DICE</span>
          </div>
          <h1 className="vpanel-title">Personalised Onboarding → Smart Shopping</h1>
          <p className="vpanel-desc">Interactive wireframe flow for judges</p>
        </div>

        <div className="vpanel-scroll">
          <div className="vpanel-group">
            <div className="vgroup-header">
              <span className="vgroup-title">Phase 1: Onboarding</span>
              <span className="vgroup-count">5 steps</span>
            </div>
            <div className="vstep-list">
              <button
                className={`vstep-btn ${phase==='onboarding'&&onboardScreen==='splash'?'active':''}`}
                onClick={() => { jumpTo('onboarding', 'splash'); setMobileOpen(false); }}
              >
                <span className="vstep-num">01</span>
                <div className="vstep-info">
                  <span className="vstep-name">Splash Screen</span>
                  <span className="vstep-sub">Brand intro and animated loader</span>
                </div>
                {phase==='onboarding'&&onboardScreen==='splash' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${phase==='onboarding'&&onboardScreen==='gender'?'active':''}`}
                onClick={() => { jumpTo('onboarding', 'gender'); setMobileOpen(false); }}
              >
                <span className="vstep-num">02</span>
                <div className="vstep-info">
                  <span className="vstep-name">Gender Selection</span>
                  <span className="vstep-sub">Voice assisted profile start</span>
                </div>
                {phase==='onboarding'&&onboardScreen==='gender' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${phase==='onboarding'&&onboardScreen==='age'?'active':''}`}
                onClick={() => { jumpTo('onboarding', 'age'); setMobileOpen(false); }}
              >
                <span className="vstep-num">03</span>
                <div className="vstep-info">
                  <span className="vstep-name">Age Group</span>
                  <span className="vstep-sub">Demographic personalization</span>
                </div>
                {phase==='onboarding'&&onboardScreen==='age' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${phase==='onboarding'&&onboardScreen==='interests'?'active':''}`}
                onClick={() => { jumpTo('onboarding', 'interests'); setMobileOpen(false); }}
              >
                <span className="vstep-num">04</span>
                <div className="vstep-info">
                  <span className="vstep-name">Interest Tags</span>
                  <span className="vstep-sub">Visual multi-category selection</span>
                </div>
                {phase==='onboarding'&&onboardScreen==='interests' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${phase==='onboarding'&&onboardScreen==='home'?'active':''}`}
                onClick={() => { jumpTo('onboarding', 'home'); setMobileOpen(false); }}
              >
                <span className="vstep-num">05</span>
                <div className="vstep-info">
                  <span className="vstep-name">Feed & Transition</span>
                  <span className="vstep-sub">Tailored feed + CTA to shop</span>
                </div>
                {phase==='onboarding'&&onboardScreen==='home' && <span className="vstep-dot" />}
              </button>
            </div>
          </div>

          <div className="vpanel-group">
            <div className="vgroup-header">
              <span className="vgroup-title">Phase 2: Smart Shopping</span>
              <span className="vgroup-count">5 steps</span>
            </div>
            <div className="vstep-list">
              <button
                className={`vstep-btn ${phase==='summarizer'&&summarizerScreen==='listing'?'active':''}`}
                onClick={() => { jumpTo('summarizer', 'listing'); setMobileOpen(false); }}
              >
                <span className="vstep-num">06</span>
                <div className="vstep-info">
                  <span className="vstep-name">Product Listing</span>
                  <span className="vstep-sub">Multi-item compare tray</span>
                </div>
                {phase==='summarizer'&&summarizerScreen==='listing' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${phase==='summarizer'&&summarizerScreen==='compare'?'active':''}`}
                onClick={() => { jumpTo('summarizer', 'compare'); setMobileOpen(false); }}
              >
                <span className="vstep-num">07</span>
                <div className="vstep-info">
                  <span className="vstep-name">Compare Table</span>
                  <span className="vstep-sub">Side by side spec matrix</span>
                </div>
                {phase==='summarizer'&&summarizerScreen==='compare' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${phase==='summarizer'&&summarizerScreen==='detail'?'active':''}`}
                onClick={() => { jumpTo('summarizer', 'detail'); setMobileOpen(false); }}
              >
                <span className="vstep-num">08</span>
                <div className="vstep-info">
                  <span className="vstep-name">Product Detail</span>
                  <span className="vstep-sub">Full page with AI breakdown</span>
                </div>
                {phase==='summarizer'&&summarizerScreen==='detail' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${phase==='summarizer'&&summarizerScreen==='ai'?'active':''}`}
                onClick={() => { jumpTo('summarizer', 'ai'); setMobileOpen(false); }}
              >
                <span className="vstep-num">09</span>
                <div className="vstep-info">
                  <span className="vstep-name">AI Review Summary</span>
                  <span className="vstep-sub">Sentiment, pros and cons</span>
                </div>
                {phase==='summarizer'&&summarizerScreen==='ai' && <span className="vstep-dot" />}
              </button>

              <button
                className={`vstep-btn ${phase==='summarizer'&&summarizerScreen==='success'?'active':''}`}
                onClick={() => { jumpTo('summarizer', 'success'); setMobileOpen(false); }}
              >
                <span className="vstep-num">10</span>
                <div className="vstep-info">
                  <span className="vstep-name">Smart Bundling</span>
                  <span className="vstep-sub">Complete the look checkout</span>
                </div>
                {phase==='summarizer'&&summarizerScreen==='success' && <span className="vstep-dot" />}
              </button>
            </div>
          </div>
        </div>

        <div className="vpanel-footer">
          <button className="vpanel-reset-btn" onClick={() => { resetAll(); setMobileOpen(false); }}>
            ↺ Reset Flow
          </button>
          <a href="index.html" className="vpanel-hub-link">
            ← Back to Feature Hub
          </a>
        </div>
      </aside>

      <main className="prototype-stage">
        <div className="device-frame-wrap">
          {phase === "onboarding" ? (
            <OnboardingApp
              screen={onboardScreen}
              setScreen={setOnboardScreen}
              onComplete={() => { setPhase("summarizer"); setSummarizerScreen("listing"); window.scrollTo({ top: 0, behavior: "smooth" }); }}
            />
          ) : (
            <SummarizerApp
              screen={summarizerScreen}
              setScreen={setSummarizerScreen}
              compareIds={compareIds}
              setCompareIds={setCompareIds}
              onBackToOnboard={() => { setPhase("onboarding"); setOnboardScreen("home"); window.scrollTo({ top: 0, behavior: "smooth" }); }}
            />
          )}
        </div>
      </main>
    </div>
  );
}

const photos = {

function Icon({ name, size = 24 }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.9, strokeLinecap: "round", strokeLinejoin: "round" };
  if (name === "back") return <svg {...common}><path d="m15 18-6-6 6-6" /></svg>;
  if (name === "speaker") return <svg {...common}><path d="M11 5 6 9H3v6h3l5 4z" /><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8 8 0 0 1 0 12" /></svg>;
  if (name === "check") return <svg {...common}><path d="m5 12 4 4L19 6" /></svg>;
  if (name === "search") return <svg {...common}><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>;
  if (name === "heart") return <svg {...common}><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z" /></svg>;
  if (name === "cart") return <svg {...common}><circle cx="9" cy="20" r="1" /><circle cx="19" cy="20" r="1" /><path d="M2 3h3l2.6 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6" /></svg>;
  if (name === "home") return <svg {...common}><path d="m3 11 9-8 9 8v10h-6v-6H9v6H3z" /></svg>;
  if (name === "grid") return <svg {...common}><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /></svg>;
  if (name === "orders") return <svg {...common}><path d="m4 7 8-4 8 4v10l-8 4-8-4z" /><path d="m4 7 8 4 8-4M12 11v10" /></svg>;
  if (name === "user") return <svg {...common}><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>;
  if (name === "mic") return <svg {...common}><rect x="9" y="2" width="6" height="13" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v4" /></svg>;
  if (name === "clock") return <svg {...common}><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>;
  return <svg {...common}><circle cx="12" cy="12" r="9" /><path d="M12 8v4M12 16h.01" /></svg>;
}

function VoiceButton({ phrase }) {
  const [speaking, setSpeaking] = useState(false);
  const speak = () => {
    setSpeaking(true);
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(phrase);
      u.rate = 0.82;
      u.onend = () => setSpeaking(false);
      window.speechSynthesis.speak(u);
    } else setTimeout(() => setSpeaking(false), 1200);
  };
  return <button className={`voice-button ${speaking ? "speaking" : ""}`} onClick={speak}><Icon name="speaker" size={23} /><span>{speaking ? "Speaking…" : "Hear this"}</span></button>;
}

  const d = disc(p.price, p.mrp);
  return <div className="bg-white rounded-2xl overflow-hidden" style={{boxShadow:'0 2px 10px rgba(0,0,0,0.08)'}}>
    <div className="relative" style={{cursor:'pointer'}} onClick={onTap}>
      <img src={p.img} alt={p.name} className="w-full object-cover bg-gray-100" style={{height:148}} />
      <div className="absolute top-2 left-2 text-white font-black px-1.5 py-0.5 rounded-md" style={{backgroundColor:'#22C55E',fontSize:10}}>{d}% OFF</div>
    </div>
    <div className="px-2.5 pt-2" onClick={onTap} style={{cursor:'pointer'}}>
      <p className="text-xs font-semibold leading-tight line-clamp-2" style={{color:DT,margin:0}}>{p.name}</p>
      <div className="flex items-center gap-1.5 mt-1"><RatingBadge2 val={p.rating} /><span style={{fontSize:10,color:ST}}>{fmt(p.reviews)}</span></div>
      <div className="mt-1.5 flex items-baseline gap-1.5"><span className="font-black" style={{fontSize:17,color:DT}}>₹{fmt(p.price)}</span><span className="text-xs line-through" style={{color:MT}}>₹{fmt(p.mrp)}</span></div>
      <div className="flex items-center gap-1 mt-0.5 mb-2"><span style={{fontSize:10,fontWeight:700,color:G}}>🚚 Free Delivery</span></div>

    <div className="px-2.5 pb-2.5"><button onClick={e => { e.stopPropagation(); onToggle(p); }} className="w-full py-1.5 rounded-lg flex items-center justify-center gap-1 font-black border" style={{fontSize:11,backgroundColor:sel?PL:'white',borderColor:sel?P:'#DDD',color:sel?P:ST}}>{sel ? '✓ Added to Compare' : '+ Add to Compare'}</button></div>
  </div>;
}

function CompareTray2({ compareIds, onRemove, onCompare, onClear }) {

      <div className="flex items-center justify-between mb-2.5"><span className="text-sm font-black" style={{color:P}}>✨ Compare Products</span><div className="flex items-center gap-3"><span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{backgroundColor:PL,color:P}}>{compareIds.length}/4</span><button onClick={onClear} className="text-xs font-bold" style={{color:ST}}>Clear</button></div></div>
      <div className="flex gap-2 mb-3">{[0,1,2,3].map(i => { const p = sel[i]; return <div key={i} className="flex-1 rounded-xl overflow-hidden border relative" style={{height:60,borderColor:p?P:'#E5E5E5',backgroundColor:p?PL:'#FAFAFA'}}>{p ? <><img src={p.img} alt={p.short} className="w-full object-cover" style={{height:'100%'}} /><p className="absolute" style={{bottom:2,left:4,right:16,fontSize:9,fontWeight:900,color:'white',margin:0}}>{p.short}</p><button onClick={() => onRemove(p.id)} className="absolute bg-white rounded-full" style={{top:2,right:2,width:18,height:18,display:'grid',placeItems:'center',fontSize:10,boxShadow:'0 1px 3px rgba(0,0,0,.25)'}}>✕</button></> : <div className="w-full" style={{height:'100%',display:'grid',placeItems:'center'}}><span style={{fontSize:9,color:MT}}>+ Add</span></div>}</div>; })}</div>

        <div className="px-3 py-2" style={{backgroundColor:PL,borderBottom:`1px solid ${PB}`}}><span style={{fontSize:11,fontWeight:900,letterSpacing:'.1em',color:P}}>COMPARISON</span></div>

function AIScreen2({ onBack }) {
  const data = { summary: 'Most buyers praise the lightweight, breathable fabric and secure adjustable fit. A few mention that the front logo feels stiff and lighter colours need frequent cleaning.', pros: ['Lightweight for all-day wear', 'Breathable fabric with mesh ventilation', 'Secure and easy-to-adjust fit', 'Curved brim provides good sun coverage'], cons: ['Front logo feels stiff to some buyers', 'Light colours show dust quickly'] };
  const [isSpeaking, setIsSpeaking] = useState(false);
  const toggleVoice = () => {
    if (!('speechSynthesis' in window)) return;
    if (isSpeaking) { window.speechSynthesis.cancel(); setIsSpeaking(false); return; }
    window.speechSynthesis.cancel();
    const speech = new SpeechSynthesisUtterance(data.summary);
    speech.lang = 'en-IN'; speech.rate = 0.92;
    speech.onend = () => setIsSpeaking(false); speech.onerror = () => setIsSpeaking(false);
    setIsSpeaking(true); window.speechSynthesis.speak(speech);
  };
  useEffect(() => () => window.speechSynthesis?.cancel(), []);

  return <div style={{backgroundColor:BG2,minHeight:'100%'}}>
    <div className="sticky top-0 z-40" style={{backgroundColor:P}}><div className="flex items-center gap-2 px-3 py-2.5"><button onClick={onBack} className="text-white"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button><div className="flex-1"><p className="text-white font-black" style={{fontSize:15,margin:0}}>AI Review Summary</p><p className="text-white" style={{fontSize:11,opacity:.75,margin:0}}>Puma Essentials Sports Cap</p></div></div></div>
    <div className="pb-4 overflow-y-auto scrollbar-hide">
      <div className="px-3 pt-3 pb-2"><p className="text-xs font-semibold" style={{color:ST,margin:0}}>Based on 6,732 customer reviews</p></div>
      <div className="mx-3 rounded-2xl overflow-hidden mb-3" style={{border:`1.5px solid ${PB}`,boxShadow:'0 4px 16px rgba(159,32,137,0.12)'}}>
        <div className="px-4 py-3" style={{background:`linear-gradient(135deg, #F5E8F3, #FEF0FD)`}}>
          <div className="flex items-center gap-2 mb-2"><span style={{color:P}}>✨</span><span className="font-black text-sm" style={{color:P}}>AI Summary</span></div>
          <p className="text-sm leading-relaxed font-semibold" style={{color:DT,margin:0}}>"{data.summary}"</p>
          <button onClick={toggleVoice} className="mt-3 flex items-center gap-2 rounded-xl px-3 py-2 text-xs font-black border" style={{color:isSpeaking?'white':P,backgroundColor:isSpeaking?P:'white',borderColor:P}}>🔊 {isSpeaking ? 'Stop audio' : 'Listen to summary'}</button>
        </div>
        <div className="bg-white px-4 py-3" style={{borderTop:`1px solid ${PB}`}}>
          <span style={{fontSize:12,fontWeight:900,color:G}}>✓ Pros</span>
          <div className="space-y-2 mt-2">{data.pros.map(p => <div key={p} className="flex items-start gap-2"><span style={{color:G,flexShrink:0}}>✓</span><span className="text-xs" style={{color:DT}}>{p}</span></div>)}</div>
        </div>
        <div className="bg-white px-4 py-3" style={{borderTop:'1px solid #EEE'}}>
          <span style={{fontSize:12,fontWeight:900,color:'#EF4444'}}>✗ Cons</span>
          <div className="space-y-2 mt-2">{data.cons.map(c => <div key={c} className="flex items-start gap-2"><span style={{color:'#EF4444',flexShrink:0}}>✕</span><span className="text-xs" style={{color:DT}}>{c}</span></div>)}</div>
        </div>
      </div>
      <div className="bg-white mx-3 rounded-2xl p-4 mb-3" style={{boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}>
        <p className="font-black text-sm mb-3" style={{color:DT,margin:'0 0 12px'}}>Review Sentiment</p>
        {[{label:'Positive',pct:78,color:G},{label:'Neutral',pct:15,color:'#F59E0B'},{label:'Negative',pct:7,color:'#EF4444'}].map(s => <div key={s.label} className="flex items-center gap-3 mb-2"><span className="text-xs font-semibold" style={{color:ST,width:70,textAlign:'right'}}>{s.label}</span><div className="flex-1 rounded-full overflow-hidden" style={{height:10,backgroundColor:'#EEE'}}><div className="rounded-full" style={{height:'100%',width:`${s.pct}%`,backgroundColor:s.color}} /></div><span className="text-xs font-black" style={{color:s.color,width:32}}>{s.pct}%</span></div>)}
      </div>
    </div>
  </div>;
}

}
